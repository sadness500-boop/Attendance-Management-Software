<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1757">
<meta name="app-version" content="1.2.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{color-scheme:light}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Attendance Management Software</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: operations console — top bar, site rail on the left, ledger-style monthly grid (계획 / 변경 / 시간가감 / 요약) */
/* Layout: S-Tec console — navy brand band (logo · 담당 · QR · 추천 · 테마), menu row, then pages: 메인 / 조직 / 사업장 근태 원장 / 개인 달력 */
:root{
  --bg:#eef1f8; --panel:#ffffff; --panel2:#f5f7fc; --ink:#141a3a; --muted:#59617f; --line:#d3d9ea; --line2:#e6eaf4;
  --accent:#1530a0; --accent-ink:#ffffff; --accent-soft:#e3e8fa; --green:#1d7a30; --green-soft:#e1f2e4;
  --band1:#0b1757; --band2:#14267e; --band-ink:#ffffff; --band-muted:#b9c3ec; --band-card:rgba(255,255,255,.08); --band-line:rgba(255,255,255,.18);
  --a-fg:#8a5300; --a-bg:#fcefd6; --b-fg:#2b3399; --b-bg:#e3e5fb; --k-fg:#16702f; --k-bg:#dcf1e0; --d-fg:#666f88; --d-bg:#eceff6;
  --sun:#c23a3a; --sat:#2550c4; --pos:#167a35; --neg:#bf3326; --chg:#fff3bf; --chg-line:#e2c45a; --focus:#2f5be0;
  --shadow:0 10px 30px rgba(12,22,80,.18);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f2c; --panel:#11183d; --panel2:#161f4b; --ink:#e6eaf8; --muted:#97a1c7; --line:#27315f; --line2:#1e2853;
  --accent:#8ea6ff; --accent-ink:#0a0f2c; --accent-soft:#1d2a66; --green:#6fd28a; --green-soft:#16372a;
  --band1:#070c2a; --band2:#0f1c5e;
  --a-fg:#f1c27a; --a-bg:#3a2c14; --b-fg:#b9bcff; --b-bg:#272a63; --k-fg:#86e0a0; --k-bg:#153a24; --d-fg:#8e97b6; --d-bg:#1c2550;
  --sun:#ff8a80; --sat:#93b0ff; --pos:#72d892; --neg:#ff8a7a; --chg:#3b3415; --chg-line:#8c7a2c; --focus:#8ea6ff;
  --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f2c; --panel:#11183d; --panel2:#161f4b; --ink:#e6eaf8; --muted:#97a1c7; --line:#27315f; --line2:#1e2853;
  --accent:#8ea6ff; --accent-ink:#0a0f2c; --accent-soft:#1d2a66; --green:#6fd28a; --green-soft:#16372a;
  --band1:#070c2a; --band2:#0f1c5e;
  --a-fg:#f1c27a; --a-bg:#3a2c14; --b-fg:#b9bcff; --b-bg:#272a63; --k-fg:#86e0a0; --k-bg:#153a24; --d-fg:#8e97b6; --d-bg:#1c2550;
  --sun:#ff8a80; --sat:#93b0ff; --pos:#72d892; --neg:#ff8a7a; --chg:#3b3415; --chg-line:#8c7a2c; --focus:#8ea6ff;
  --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* brand band */
.band{background:linear-gradient(100deg,var(--band1),var(--band2));color:var(--band-ink)}
.band-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.logo img{height:40px;width:auto;border-radius:6px;background:#fff;padding:2px 4px}
.logo b{display:block;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.logo small{display:block;font-size:11.5px;color:var(--band-muted)}
.ver{font-family:var(--f-num);font-size:10.5px;padding:0 5px;border:1px solid var(--band-line);border-radius:4px;color:var(--band-muted);margin-left:6px;vertical-align:1px}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;align-items:center}
.bcard{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border:1px solid var(--band-line);background:var(--band-card);border-radius:12px;color:var(--band-ink);cursor:pointer;text-align:left;min-width:0}
.bcard:hover{background:rgba(255,255,255,.14)}
.bcard .ph{width:42px;height:42px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.bcard .ph img,.bcard .ph canvas{width:100%;height:100%;object-fit:cover;display:block}
.bcard .ph svg{width:24px;height:24px;color:var(--band2)}
.bcard .t1{font-size:11.5px;color:var(--band-muted);display:block;line-height:1.25}
.bcard .t2{font-size:13px;font-weight:700;display:block;line-height:1.3;white-space:nowrap}
.bcard .t2 em{font-style:normal;color:#9fe3ad}
.bcard .t3{font-size:11px;color:var(--band-muted);display:block;line-height:1.25}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--band-line)}
.seg button{border:0;background:none;color:var(--band-ink);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--band1);font-weight:600}
.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line2)}
.menu-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs a{padding:6px 11px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs a:hover{background:var(--panel2);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.month{display:flex;align-items:center;gap:6px;margin-left:auto}
.month select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.ibtn{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;display:grid;place-items:center}
.ibtn:hover{background:var(--panel2)}
@media (max-width:760px){ .bcard .t1,.bcard .t3{display:none} .bcard{padding:4px 10px 4px 4px} .bcard .ph{width:34px;height:34px} .cards{margin-left:0} .logo img{height:34px} }

/* modal */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(6,10,40,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px}
.modal h2{margin:0 0 4px;font-size:17px}
.modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.qrbig{display:grid;place-items:center;background:#fff;border-radius:10px;padding:14px;margin-bottom:12px}
.qrbig canvas,.qrbig img{width:min(240px,70vw)!important;height:auto!important}
.urlbox{display:flex;gap:6px;margin-bottom:10px}
.urlbox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--panel2);font-family:var(--f-num);font-size:12px}
.mrow{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.avatar-edit{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.avatar-edit .av{width:64px;height:64px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--accent);font-size:22px}
.avatar-edit .av img{width:100%;height:100%;object-fit:cover}

/* gate */
.gate{max-width:560px;margin:24px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.gate .hero{background:linear-gradient(120deg,var(--band1),var(--band2));padding:0}
.gate .hero img{display:block;width:100%;height:auto;max-height:230px;object-fit:cover}
.gate .body{padding:20px}
.gate h1{margin:0 0 4px;font-size:20px;text-wrap:balance}
.gate .lock{display:flex;gap:8px;align-items:center;color:var(--neg);font-size:13px;font-weight:600;margin-bottom:12px}

/* home */
.hero-home{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:center;background:linear-gradient(120deg,var(--band1),var(--band2));color:var(--band-ink);border-radius:16px;padding:22px 24px;margin-bottom:16px;overflow:hidden}
.hero-home h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em;text-wrap:balance}
.hero-home p{margin:0 0 14px;color:var(--band-muted);font-size:13.5px;max-width:60ch}
.hero-home img{width:100%;max-width:220px;border-radius:14px;justify-self:end}
.hk{display:flex;flex-wrap:wrap;gap:8px}
.hk div{background:rgba(255,255,255,.1);border:1px solid var(--band-line);border-radius:10px;padding:7px 12px}
.hk span{display:block;font-size:11.5px;color:var(--band-muted)}
.hk b{font-family:var(--f-num);font-size:17px}
.entry{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.entry a{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--ink);min-width:0;position:relative}
.entry a:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.entry .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.entry .ic.g{background:var(--green-soft);color:var(--green)}
.entry .ic svg{width:21px;height:21px}
.entry b{font-size:15px}
.entry p{margin:0;font-size:12.5px;color:var(--muted)}
.entry .cnt{font-family:var(--f-num);font-size:12px;color:var(--accent);font-weight:600;margin-top:auto}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line);margin-left:9px}
.tree li>div{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;flex-wrap:wrap}
.tree li>div:hover{background:var(--panel2)}
.tree li>div.sel{background:var(--accent-soft)}
.otype{font-size:10.5px;padding:0 6px;border-radius:9px;font-weight:600;white-space:nowrap}
.ot-회사{background:var(--accent);color:var(--accent-ink)} .ot-본부{background:var(--b-bg);color:var(--b-fg)} .ot-지사{background:var(--green-soft);color:var(--green)} .ot-권역{background:var(--a-bg);color:var(--a-fg)}
.tree .nums{margin-left:auto;font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.crumb{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* person calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wh{font-size:12px;text-align:center;color:var(--muted);font-weight:600}
.cal .day{border:1px solid var(--line2);border-radius:8px;background:var(--panel);min-height:78px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .day:hover{border-color:var(--focus)}
.cal .day.blank{background:transparent;border:0;cursor:default}
.cal .day.out{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line2) 4px 5px);cursor:default}
.cal .dn{font-family:var(--f-num);font-size:12px;font-weight:600}
.cal .pl{font-family:var(--f-num);font-weight:700;font-size:13px;border-radius:4px;padding:0 5px;align-self:flex-start}
.cal .cg{font-size:11px;background:var(--chg);border-radius:4px;padding:0 4px;align-self:flex-start}
.cal .hr{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-top:auto}
@media (max-width:900px){ .entry{grid-template-columns:repeat(2,minmax(0,1fr))} .hero-home{grid-template-columns:minmax(0,1fr)} .hero-home img{display:none} }
@media (max-width:520px){ .cal{gap:3px} .cal .day{min-height:58px;padding:3px} .cal .hr{display:none} }

.wrap{padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.note b{color:var(--accent)}
.note .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}

/* grid page */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px)}
.rail input{width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 12px;background:var(--panel2)}
.rail ul{list-style:none;margin:0;padding:4px;max-height:calc(100vh - 170px);overflow:auto}
.rail li button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;padding:7px 8px;border:0;background:none;border-radius:6px;cursor:pointer}
.rail li button:hover{background:var(--panel2)}
.rail li button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rail .sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .sc{font-family:var(--f-num);font-size:11px;opacity:.75}
.rail .ot{font-family:var(--f-num);font-size:10.5px;padding:0 5px;border-radius:9px;background:var(--chg);color:var(--ink)}
.site-pick{display:none}
.main{min-width:0}
.sheet-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:10px}
.sheet-head h1{margin:0;font-size:20px;letter-spacing:-.02em;text-wrap:balance}
.sheet-head .sub{color:var(--muted);font-size:12.5px}
.sheet-head .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{color:var(--neg)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;gap:8px;align-items:baseline}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--f-num);font-size:15px}
.kpi b.pos{color:var(--pos)} .kpi b.neg{color:var(--neg)}

.scroller{overflow:auto;max-height:calc(100vh - 240px);border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.att{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.att th,table.att td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0;text-align:center;white-space:nowrap}
table.att thead th{position:sticky;background:var(--panel2);z-index:3;font-weight:600}
table.att thead tr:nth-child(1) th{top:0;height:24px}
table.att thead tr:nth-child(2) th{top:24px;height:22px;font-weight:500}
table.att .stk1{position:sticky;left:0;z-index:2;background:var(--panel);min-width:122px;max-width:122px;text-align:left;padding:4px 8px;white-space:normal;vertical-align:top}
table.att .stk2{position:sticky;left:122px;z-index:2;background:var(--panel);min-width:54px;color:var(--muted);font-size:11px;border-right:1px solid var(--line)}
table.att thead .stk1,table.att thead .stk2{z-index:5;background:var(--panel2)}
.dcol{min-width:31px;width:31px}
.d-sun{color:var(--sun)} .d-sat{color:var(--sat)} .d-hol{color:var(--sun);background:color-mix(in srgb,var(--sun) 9%,var(--panel2))!important}
.d-today{box-shadow:inset 0 -2px 0 var(--accent)}
.empname{font-weight:600;font-size:13px;display:block}
.emppost{font-size:11px;color:var(--muted);display:block;line-height:1.35}
.empcode{font-family:var(--f-num);font-size:10.5px;color:var(--accent);display:block;margin-top:2px}
tr.r-plan td{border-top:1px solid var(--line)}
td.c{height:24px;font-family:var(--f-num);font-weight:500}
.s-A{color:var(--a-fg);background:var(--a-bg)} .s-B{color:var(--b-fg);background:var(--b-bg)} .s-K{color:var(--k-fg);background:var(--k-bg)} .s-D{color:var(--d-fg);background:var(--d-bg)}
.s-L{color:var(--pos)} .s-X{color:var(--neg)}
td.hold{color:var(--sun)}
td.out{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line2) 4px 5px)}
tr.r-chg td.c{cursor:pointer;background:var(--panel)}
tr.r-chg td.c:hover{box-shadow:inset 0 0 0 2px var(--focus)}
tr.r-chg td.c.has{background:var(--chg);box-shadow:inset 0 0 0 1px var(--chg-line)}
tr.r-chg td.c sup{font-size:9px;color:var(--pos);margin-left:1px}
tr.r-chg td.c sup.m{color:var(--neg)}
tr.r-adj td.c{font-size:11px;height:20px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
tr.r-note td{font-size:11.5px;color:var(--muted);text-align:left;padding:3px 8px;background:var(--panel2);white-space:normal}
tr.r-note td b{color:var(--ink);font-weight:600}
tr.r-note .memo{color:var(--ink)}
td.sum{font-family:var(--f-num);min-width:34px;padding:0 4px}
td.hsum{font-family:var(--f-num);min-width:54px;padding:2px 6px;text-align:right;vertical-align:middle}
td.hsum small{display:block;font-size:10px;color:var(--muted);font-family:var(--f-ui)}
th.grp{background:var(--accent-soft)!important;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;min-width:20px;padding:0 4px;text-align:center;border-radius:3px;font-style:normal;font-family:var(--f-num);font-weight:600;margin-right:4px}

/* popover editor */
.pop{position:absolute;z-index:50;width:320px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px}
.pop h3{margin:0 0 2px;font-size:14px}
.pop .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 2px;cursor:pointer;font-size:12px;line-height:1.2}
.chip b{display:block;font-family:var(--f-num);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);min-width:0}
.hrow{display:flex;gap:4px;align-items:center}
.hrow input{width:76px}
.calc{background:var(--panel2);border-radius:6px;padding:7px 9px;font-size:12.5px;margin-bottom:10px}
.calc b{font-family:var(--f-num)}
.pop .row{display:flex;gap:6px;justify-content:flex-end}
.scrim{position:fixed;inset:0;z-index:40;background:transparent}

/* generic panels / tables */
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:15px}
.panel-h .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.panel-b{padding:14px}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 230px)}
table.list{border-collapse:collapse;width:100%;font-size:12.5px}
table.list th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.list td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.list tr.sel td{background:var(--accent-soft)}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--panel2)}
table.list td.r,table.list th.r{text-align:right}
.seq{display:inline-flex;gap:2px;flex-wrap:wrap}
.seq i{font-style:normal;font-family:var(--f-num);font-weight:600;font-size:11px;width:17px;height:18px;display:grid;place-items:center;border-radius:3px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.watch{border-color:var(--k-fg);color:var(--k-fg)}
.code-id{font-family:var(--f-num);font-weight:600;color:var(--accent);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ttbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:10px}
.ttbl th,.ttbl td{border-bottom:1px solid var(--line2);padding:5px 4px;text-align:left}
.ttbl input{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 5px;background:var(--panel);min-width:0}
.prev{overflow:auto;border:1px solid var(--line2);border-radius:8px}
.prev table{border-collapse:collapse;font-size:11px}
.prev th,.prev td{border:1px solid var(--line2);width:24px;height:20px;text-align:center;font-family:var(--f-num)}
.prev th:first-child,.prev td:first-child{width:auto;padding:0 6px;white-space:nowrap;font-family:var(--f-ui)}
.hist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:5px}
.hist li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:6px;padding:6px 8px;font-size:12.5px}
.hist li .code-id{font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.err{color:var(--neg);font-size:12px;min-height:1em}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--neg)}
.empty{padding:30px;text-align:center;color:var(--muted)}
textarea.json{width:100%;min-height:150px;font-family:var(--f-num);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--panel2)}
.about{display:grid;gap:4px;font-size:13px}
.about .sig{font-family:var(--f-num);color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
footer .sig{color:var(--accent);font-weight:600}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .site-pick{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:10px}
  .two{grid-template-columns:minmax(0,1fr)}
  .month{margin-left:0}
  .scroller{max-height:none}
}
@media (max-width:520px){
  .pop{position:fixed;left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-width:none;border-radius:14px 14px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .scrim{background:rgba(0,0,0,.25)}
  .grid2{grid-template-columns:1fr}
}

:root{ --map-sea:#cfe3f3; --map-land:#f6f4ec; --map-land2:#e9e7df; --map-coast:#9db7cc; --mk-best:#16205e; --mk-sys:#7b4fd0; --mk-ams:#1d8a3a; --mk-me:#2f7cf6; --mk-office:#c2410c;
  --sig-lead:#c06a95; --sig-name:#3b4fd8; --f-sig:"RR Signature","Segoe Script","Brush Script MT",cursive; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --map-sea:#0e1a3a; --map-land:#1f2a52; --map-land2:#18213f; --map-coast:#3b4f8a; --mk-best:#c9d3ff; --mk-sys:#b893ff; --mk-ams:#5fe08a; --mk-me:#6aa8ff; --mk-office:#ffad7a; --sig-lead:#f0a3c6; --sig-name:#a9b8ff }}
:root[data-theme="dark"]{ --map-sea:#0e1a3a; --map-land:#1f2a52; --map-land2:#18213f; --map-coast:#3b4f8a; --mk-best:#c9d3ff; --mk-sys:#b893ff; --mk-ams:#5fe08a; --mk-me:#6aa8ff; --mk-office:#ffad7a; --sig-lead:#f0a3c6; --sig-name:#a9b8ff }
.mapsec{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
.mapbox{position:relative;height:520px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--map-sea)}
.mapel{position:absolute;inset:0}
.mapel canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.mapel canvas:active{cursor:grabbing}
.mapctl{position:absolute;z-index:5;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow:hidden}
.mapctl button{border:0;background:none;padding:7px 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.mapctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mapctl.me{top:12px;left:12px}
.mapctl.type{top:12px;right:12px}
.mapctl.zoom{top:58px;right:12px;flex-direction:column}
.mapctl.zoom button{font-size:18px;padding:4px 11px}
.maplegend{position:absolute;z-index:5;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:flex-end;font-size:11.5px;pointer-events:none}
.maplegend span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 9px;display:inline-flex;gap:5px;align-items:center;color:var(--ink)}
.lg{display:inline-block;width:10px;height:10px}
.lg.best{border-radius:50%;background:var(--mk-best)} .lg.sys{background:var(--mk-sys);transform:rotate(45deg) scale(.8)} .lg.ams{border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--mk-ams)} .lg.me{border-radius:50%;background:var(--mk-me);box-shadow:0 0 0 3px color-mix(in srgb,var(--mk-me) 30%,transparent)}
.mapstate{position:absolute;z-index:5;left:12px;top:56px;font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);max-width:60%}
/* kakao overlays */
.mk{cursor:pointer}
.mk-best{width:11px;height:11px;border-radius:50%;background:#16205e;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.mk-sys{width:9px;height:9px;background:#7b4fd0;border:1.5px solid #fff;transform:rotate(45deg)}
.mk-ams{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#1d8a3a;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.mk-me{width:14px;height:14px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,124,246,.25)}
.mk-lab{background:#fff;color:#16205e;border:1.5px solid #16205e;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mk-lab.off{color:#c2410c;border-color:#c2410c}
.mk-sel{outline:3px solid #f5b400;outline-offset:2px}
.sp h2{margin:0;font-size:15px}
.sp .spsearch{position:relative}
.sp .spsearch input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.spres{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:8px;max-height:240px;overflow:auto}
.spres li button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line2)}
.spres li button:hover{background:var(--panel2)}
.spres small{color:var(--muted);margin-left:auto;font-size:11px;white-space:nowrap}
.kindtag{font-size:10.5px;padding:0 6px;border-radius:9px;font-weight:600;white-space:nowrap}
.kt-ams{background:var(--green-soft);color:var(--green)} .kt-best{background:var(--accent-soft);color:var(--accent)} .kt-sys{background:color-mix(in srgb,var(--mk-sys) 16%,var(--panel));color:var(--mk-sys)} .kt-branch,.kt-office{background:var(--a-bg);color:var(--a-fg)}
.spd{display:grid;gap:8px;margin-top:10px}
.spd h3{margin:0;font-size:16px;text-wrap:balance}
.spd .addr{font-size:12.5px;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.near{list-style:none;margin:0;padding:0;font-size:12.5px}
.near li{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line2);cursor:pointer}
.near li:hover b{color:var(--accent)}
.near li>span:last-child{margin-left:auto;font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.enjoy{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px 20px;display:grid;gap:12px;margin-top:16px}
.enjoyH{margin:0;font-family:"Enjoy Script","Great Vibes",cursive;font-weight:400;font-size:2.3rem;line-height:1.15;color:var(--accent)}
.enjoyGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.enjoyCard{display:flex;gap:14px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--ink);text-decoration:none;min-width:0;transition:border-color .15s,box-shadow .15s,transform .15s}
.enjoyCard:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(20,38,126,.12);transform:translateY(-1px)}
.enjoyIc{flex:none;width:58px;height:58px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden}
.enjoyIc img{width:48px;height:48px;border-radius:10px;display:block}
.enjoyTx{display:grid;gap:3px;min-width:0}
.enjoyTx b{font-size:1rem}
.enjoyTx small{font-size:.8rem;color:var(--muted);line-height:1.4}
.enjoyTx em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--accent)}
footer.sign{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.signL{display:flex;gap:14px;align-items:center;min-width:0}
.signL img{height:50px;width:auto;border-radius:6px;display:block;background:#fff}
.signL b{font-size:.92rem;color:var(--ink)}
.signL span{font-size:.76rem;color:var(--muted)}
.makerWrap{display:flex;align-items:center;gap:12px;margin-left:auto}
.makerFig{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 10%;border:2px solid var(--line);background:#d9dbe0}
.maker{font-family:var(--f-sig);font-size:1.6rem;line-height:1.2;white-space:nowrap}
.maker .a{color:var(--sig-lead);font-size:.82em}
.maker .n{color:var(--sig-name);font-size:1.18em}
#saveState{font-size:11.5px;color:var(--muted)}
@media (max-width:900px){ .mapsec{grid-template-columns:minmax(0,1fr)} .mapbox{height:420px} .enjoyGrid{grid-template-columns:minmax(0,1fr)} .enjoyH{font-size:2rem} .makerWrap{margin-left:0} .maker{font-size:1.25rem} }
@media (prefers-reduced-motion:reduce){.toast{transition:none} .enjoyCard{transition:none}}
</style>

/* ===== core engine: plan is always regenerated from code; changes live in a separate layer ===== */
function assignment(emp, y, m){
  const key = ym(y,m); let a = null;
  [...emp.hist].sort((p,q)=>p.from<q.from?-1:1).forEach(h=>{ if(h.from<=key) a=h; });
  return a || emp.hist[0] || null;
}
function hours(code, s){
  const t = (code && code.times && code.times[s]) || DEF_T[s]; if(!t) return 0;
  let span = mod(toMin(t.e)-toMin(t.s),1440); if(span===0) span=1440;
  return Math.max(0, span/60 - (Number(t.b)||0));
}
function employed(emp, ds){ if(emp.hire && ds<emp.hire) return false; if(emp.leave && ds>emp.leave) return false; return true; }
function planOf(emp, y, m, d){
  const ds = iso(y,m,d);
  if(!employed(emp, ds)) return {s:null, out:true, ds};
  const a = assignment(emp,y,m); const c = a && codeMap[a.code];
  if(!c || !c.seq) return {s:'?', ds, code:c};
  const s = c.seq[mod(dnum(y,m,d) - parseIso(c.anchor) + (a.jo||0), c.seq.length)];
  if(c.hol && holMap.has(ds) && s!=='D') return {s:'D', hol:true, ds, code:c};
  return {s, ds, code:c};
}
function dayCalc(emp, y, m, d){
  const p = planOf(emp,y,m,d);
  const out = {p, planH:0, actH:0, delta:0, eff:null, ov:null};
  if(p.out) return out;
  out.planH = (p.s==='A'||p.s==='B'||p.s==='K') ? hours(p.code,p.s) : 0;
  const ov = emp.ov && emp.ov[p.ds]; out.ov = ov||null;
  let act = out.planH, eff = p.s;
  if(ov && ov.s){
    const t = (symMap[ov.s]||{}).t || 'mark';
    if(t==='work'){ act = hours(p.code, ov.s); eff = ov.s; }
    else if(t==='off'){ act = 0; eff = 'D'; }
    else if(t==='paid' || t==='half'){ act = out.planH; eff = null; }
    else if(t==='unpaid'){ act = 0; eff = null; }
  }
  if(ov && ov.h) act += Number(ov.h)||0;
  out.actH = act; out.eff = eff; out.delta = act - out.planH;
  return out;
}
function monthCalc(emp, y, m){
  const n = dim(y,m), days=[];
  const r = {days, pc:{A:0,B:0,K:0,D:0}, ac:{A:0,B:0,K:0,D:0}, planH:0, actH:0, plus:0, minus:0,
    spDay:0, spNight:0, leave:0, absent:0, edu:0, sick:0, injury:0, edits:0, active:false};
  for(let d=1; d<=n; d++){
    const c = dayCalc(emp,y,m,d); days.push(c);
    if(c.p.out) continue; r.active = true;
    if(r.pc[c.p.s]!==undefined) r.pc[c.p.s]++;
    if(c.eff && r.ac[c.eff]!==undefined) r.ac[c.eff]++;
    r.planH += c.planH; r.actH += c.actH;
    if(c.delta>0) r.plus += c.delta; else r.minus += -c.delta;
    if(c.ov){ r.edits++; const s=c.ov.s;
      if(c.p.s==='D' && (s==='A')) r.spDay++;
      if(c.p.s==='D' && (s==='B'||s==='K')) r.spNight++;
      if(s==='연') r.leave+=1; if(s==='반') r.leave+=.5; if(s==='결') r.absent++; if(s==='훈'||s==='공') r.edu++; if(s==='병') r.sick++; if(s==='산') r.injury++; }
  }
  const a = assignment(emp,y,m); const code = a && codeMap[a.code];
  r.code = code; r.jo = a ? a.jo : 0;
  r.factor = code && code.ltype==='일반' ? 1.5 : 1;
  r.billed = r.plus * r.factor;
  r.workDays = r.pc.A + r.pc.B + r.pc.K*2; r.actDays = r.ac.A + r.ac.B + r.ac.K*2;
  return r;
}
const symCls = s => s==='A'||s==='B'||s==='K'||s==='D' ? 's-'+s : (symMap[s] && (symMap[s].t==='paid'||symMap[s].t==='half') ? 's-L' : (symMap[s] && symMap[s].t==='unpaid' ? 's-X' : ''));
const seqHtml = seq => '<span class="seq">'+[...seq].map(s=>`<i class="s-${s}">${s}</i>`).join('')+'</span>';
const siteEmps = sid => S.emps.filter(e=>e.site===sid);
const today = (()=>{ const t=new Date(); return iso(t.getFullYear(), t.getMonth()+1, t.getDate()); })();

/* ===== month bar ===== */
function initMonthBar(){
  const ys=$('#mYear'), ms=$('#mMon');
  ys.innerHTML = [2026,2027,2028].map(y=>`<option value="${y}">${y}년</option>`).join('');
  ms.innerHTML = Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}월</option>`).join('');
  const sync=()=>{ ys.value=UI.y; ms.value=UI.m; $('#mPrev').disabled = UI.y===2026 && UI.m===1; };
  ys.onchange=()=>{ UI.y=+ys.value; saveUI(); render(); };
  ms.onchange=()=>{ UI.m=+ms.value; saveUI(); render(); };
  $('#mPrev').onclick=()=>{ if(UI.y===2026&&UI.m===1) return; UI.m--; if(UI.m<1){UI.m=12;UI.y--;} saveUI(); render(); };

  const holsThisMonth = S.holidays.filter(h=>h.d.startsWith(ym(y,m)));
  return `
  ${UI.note?`<div class="note"><div><b>근무조 코드 → 매월 자동 생성.</b> 계획 근태는 개인에게 부여된 근무조 코드와 조(순번)로 매달 다시 계산되고, 변경 근태는 날짜별로 따로 저장됩니다. 변경을 입력해도 다음 달 계획은 코드대로 이어집니다. 변경 칸을 눌러 근태기호와 추가·차감 시간을 입력하세요.</div><button class="x" id="hideNote" aria-label="안내 닫기">×</button></div>`:''}
  <div class="layout">
    <aside class="rail" aria-label="사업장">
      <input id="siteQ" placeholder="사업장·성명 검색" value="${esc(UI.q||'')}">
      <ul>${siteList.map(s=>`<li><button aria-pressed="${s.id===UI.site}" data-site="${s.id}"><span class="sn">${esc(s.name)}</span>${otBySite[s.id]?`<span class="ot" title="변경 입력 건수">${otBySite[s.id]}</span>`:''}<span class="sc">${siteEmps(s.id).length}</span></button></li>`).join('')}</ul>

      <div class="sheet-head">
        <div><h1>□ ${esc(site?site.name:'')}</h1><div class="sub">${y}년 ${m}월 근태현황 · ${tot.n}명${holsThisMonth.length?' · 공휴일 '+holsThisMonth.map(h=>Number(h.d.slice(8))+'일 '+h.n).join(', '):''}</div></div>
        <div class="acts"><button class="btn" id="copyTsv">엑셀용 복사</button><button class="btn warn" id="clearMonth">이 달 변경 초기화</button></div>

      <div class="kpis">

        <span><i class="s-L">연</i>유급인정(연차·반차·공가·교육)</span><span><i class="s-X">결</i>무급(결근·병가·산재)</span>

function bindGrid(){
  const hn=$('#hideNote'); if(hn) hn.onclick=()=>{ UI.note=false; saveUI(); render(); };
  const sq=$('#siteQ'); sq.oninput=()=>{ UI.q=sq.value; saveUI(); const pos=sq.selectionStart; render(); const s2=$('#siteQ'); s2.focus(); s2.setSelectionRange(pos,pos); };

    td.onkeydown=ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openEditor(td); } };
  });
  $('#copyTsv').onclick=()=>copyText(siteTsv(), '현재 사업장 근태를 복사했습니다. 엑셀에 붙여넣으세요.');
  $('#clearMonth').onclick=()=>{

    box.innerHTML=`<div class="note"><div class="confirm">${esc(site.name)} ${UI.y}년 ${UI.m}월 변경 입력을 모두 지웁니다. 계획 근태는 그대로 남습니다. <button class="btn sm warn" id="cfYes">초기화</button><button class="btn sm" id="cfNo">취소</button></div></div>`;
    $('#cfNo').onclick=()=>box.innerHTML='';

  };
}
function siteTsv(){
  const {y,m}=UI, n=dim(y,m), site=siteMap[UI.site]; const L=[];
  L.push(['□ '+site.name, y+'년 '+m+'월'].join('\t'));
  L.push(['POST','성명','구분',...Array.from({length:n},(_,i)=>i+1),'주간','야간','연근','휴무','근무','계획h','실근로h','추가h','공제h','반영h'].join('\t'));
  L.push(['','','요일',...Array.from({length:n},(_,i)=>WD[dow(y,m,i+1)])].join('\t'));
  siteEmps(site.id).forEach(e=>{ const r=monthCalc(e,y,m); if(!r.active) return;
    L.push([e.post,e.name,'계획',...r.days.map(c=>c.p.s||''),r.pc.A,r.pc.B,r.pc.K,r.pc.D,r.workDays,fmtH(r.planH),fmtH(r.actH),fmtH(r.plus),fmtH(r.minus),fmtH(r.billed)].join('\t'));
    L.push(['','','변경',...r.days.map(c=>c.ov?((c.ov.s||'')+(c.ov.h?(c.ov.h>0?'+':'')+c.ov.h:'')):''),r.ac.A,r.ac.B,r.ac.K,r.ac.D,r.actDays].join('\t'));
    L.push(['','','시간가감',...r.days.map(c=>c.delta?Math.round(c.delta*10)/10:'')].join('\t'));
    L.push(['','','요약',`주간특근 ${r.spDay}일 / 야근특근 ${r.spNight}일 / 년차 ${r.leave}일 / 결근 ${r.absent}일 / 교육 ${r.edu}일 / OT ${fmtH(r.plus)}시간`].join('\t'));
  });
  return L.join('\n');
}
function copyText(txt, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(ok)).catch(()=>fallbackCopy(txt,ok));
  } else fallbackCopy(txt,ok);
}
function fallbackCopy(txt, ok){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  let done=false; try{ done=document.execCommand('copy'); }catch(e){} ta.remove(); toast(done? ok : '복사가 막혀 있습니다. 브라우저에서 직접 선택해 복사하세요.');
}

/* ===== change editor popover ===== */
function closeEditor(){ document.querySelectorAll('.pop,.scrim').forEach(n=>n.remove()); }
function openEditor(td){
  closeEditor();
  const emp = S.emps.find(e=>e.id===td.dataset.e); const d=+td.dataset.d; const {y,m}=UI;
  const c = dayCalc(emp,y,m,d); const cur = c.ov ? clone(c.ov) : {s:'',h:0,m:''};
  const scrim=document.createElement('div'); scrim.className='scrim'; scrim.onclick=closeEditor; document.body.appendChild(scrim);
  const pop=document.createElement('div'); pop.className='pop'; pop.setAttribute('role','dialog'); pop.setAttribute('aria-label','변경 근태 입력');
  const ds=iso(y,m,d); const hol=holMap.get(ds);
  function preview(){
    const tmp = clone(emp); tmp.ov = Object.assign({}, emp.ov); if(cur.s||cur.h||cur.m) tmp.ov[ds]=cur; else delete tmp.ov[ds];
    const k = dayCalc(tmp,y,m,d);
    return `계획 <b>${esc(c.p.s)}</b> ${fmtH(k.planH)}h → 실근로 <b>${fmtH(k.actH)}h</b> · 가감 <b class="${k.delta>0?'pos':k.delta<0?'neg':''}">${sgn(k.delta)}h</b>`;
  }
  function draw(){
    pop.innerHTML = `<h3>${esc(emp.name)} · ${m}월 ${d}일(${WD[dow(y,m,d)]})${hol?' · '+esc(hol):''}</h3>
      <div class="meta">${esc(c.p.code?c.p.code.id:'')} · 계획 ${esc(c.p.s)}${c.p.hol?' (공휴일 휴무)':''}</div>
      <div class="chips">${S.symbols.map(s=>`<button class="chip ${symCls(s.k)}" aria-pressed="${cur.s===s.k}" data-k="${esc(s.k)}" title="${TYPE_LABEL[s.t]}"><b>${esc(s.k)}</b>${esc(s.n)}</button>`).join('')}</div>
      <div class="field"><label for="edH">추가(+)·차감(−) 시간</label>
        <div class="hrow"><input id="edH" type="number" step="0.5" value="${cur.h||0}" class="num"><button class="btn sm" data-q="-1">−1</button><button class="btn sm" data-q="1">+1</button><button class="btn sm" data-q="2">+2</button><button class="btn sm" data-q="4">+4</button></div></div>
      <div class="field"><label for="edM">메모</label><input id="edM" value="${esc(cur.m||'')}" placeholder="예: 10/31 추가근무 4h(6h 청구 반영)"></div>
      <div class="calc" id="edCalc">${preview()}</div>
      <div class="row"><button class="btn warn" id="edDel">변경 삭제</button><button class="btn" id="edX">닫기</button><button class="btn pri" id="edOk">저장</button></div>`;
    pop.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ cur.s = cur.s===b.dataset.k ? '' : b.dataset.k; draw(); });
    pop.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ cur.h = Math.round(((Number(cur.h)||0)+Number(b.dataset.q))*10)/10; draw(); });
    const h=pop.querySelector('#edH'); h.oninput=()=>{ cur.h=Number(h.value)||0; pop.querySelector('#edCalc').innerHTML=preview(); };
    const mm=pop.querySelector('#edM'); mm.oninput=()=>{ cur.m=mm.value; };
    pop.querySelector('#edX').onclick=closeEditor;
    pop.querySelector('#edDel').onclick=()=>{ if(emp.ov) delete emp.ov[ds]; save(); closeEditor(); render(); toast('변경을 삭제했습니다'); };
    pop.querySelector('#edOk').onclick=()=>{ emp.ov = emp.ov||{}; if(cur.s||cur.h||cur.m) emp.ov[ds]={s:cur.s,h:Number(cur.h)||0,m:cur.m||''}; else delete emp.ov[ds]; save(); closeEditor(); render(); toast('저장했습니다'); };
  }
  draw(); document.body.appendChild(pop);
  const r=td.getBoundingClientRect(); const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left = r.left + window.scrollX - pw/2 + r.width/2; left = Math.max(window.scrollX+12, Math.min(left, window.scrollX+document.documentElement.clientWidth-pw-12));
  let top = r.bottom + window.scrollY + 6; if(r.bottom + ph + 12 > window.innerHeight) top = Math.max(window.scrollY+12, r.top + window.scrollY - ph - 6);
  pop.style.left=left+'px'; pop.style.top=top+'px';
  const first=pop.querySelector('.chip[aria-pressed="true"]')||pop.querySelector('.chip'); first && first.focus();
  pop.addEventListener('keydown',ev=>{ if(ev.key==='Escape') closeEditor(); });
}

function codeEditor(c){
  const {y,m}=UI, n=dim(y,m); const L=c.seq.length;
  let prev = `<table><thead><tr><th>조 \\ 일</th>${Array.from({length:n},(_,i)=>{ const w=dow(y,m,i+1), hol=holMap.has(iso(y,m,i+1)); return `<th class="${hol||w===0?'d-sun':w===6?'d-sat':''}">${i+1}</th>`; }).join('')}</tr></thead><tbody>`;
  for(let j=0;j<Math.min(L,14);j++){
    prev += `<tr><td>${j+1}조</td>`;
    for(let d=1; d<=n; d++){ let s=c.seq[mod(dnum(y,m,d)-parseIso(c.anchor)+j, L)]; if(c.hol && holMap.has(iso(y,m,d))) s='D'; prev += `<td class="s-${s}">${s}</td>`; }
    prev += '</tr>';
  }
  prev += '</tbody></table>';
  const syms = ['A','B','K'].filter(s=>c.seq.includes(s));
  return `<div class="panel-h"><h2><span class="code-id">${esc(c.id)}</span></h2><div class="sp"><span class="tag">사용 ${codeUse(c.id)}명</span></div></div>
  <div class="panel-b">
    <div class="grid2">
      <div class="field"><label for="cId">코드</label><input id="cId" value="${esc(c.id)}" class="num"></div>
      <div class="field"><label for="cName">근무조명</label><input id="cName" value="${esc(c.name)}"></div>
      <div class="field"><label for="cJob">직군</label><select id="cJob">${Object.entries(JOBS).map(([k,v])=>`<option value="${k}" ${k===c.job?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="cLt">근로형태</label><select id="cLt">${LTYPES.map(v=>`<option ${v===c.ltype?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="cSeq">순환 패턴 (A·B·K·D, 1조 기준)</label><input id="cSeq" value="${esc(c.seq)}" class="num" style="text-transform:uppercase"></div>
      <div class="field"><label for="cAn">기준일 (패턴 첫 칸 날짜)</label><input id="cAn" type="date" value="${esc(c.anchor)}"></div>
    </div>
    <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cHol" ${c.hol?'checked':''}> 공휴일은 휴무(D)로 생성</label>
    <table class="ttbl"><thead><tr><th>기호</th><th>출근</th><th>퇴근</th><th>휴게(h)</th><th>실근로</th></tr></thead><tbody>
      ${syms.map(s=>{ const t=(c.times&&c.times[s])||DEF_T[s]; return `<tr><td><i class="s-${s}" style="font-style:normal;padding:0 5px;border-radius:3px;font-family:var(--f-num);font-weight:600">${s}</i></td><td><input data-t="${s}" data-f="s" value="${esc(t.s)}" class="num"></td><td><input data-t="${s}" data-f="e" value="${esc(t.e)}" class="num"></td><td><input data-t="${s}" data-f="b" type="number" step="0.5" value="${t.b}" class="num"></td><td class="num">${fmtH(hours(c,s))}h</td></tr>`; }).join('')||'<tr><td colspan="5">근무 기호가 없습니다.</td></tr>'}
    </tbody></table>
    <div class="err" id="cErr"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"><button class="btn pri" id="cSave">코드 저장</button><button class="btn" id="cDup">복제</button><button class="btn warn" id="cDel">삭제</button><span id="cConfirm"></span></div>
    <p class="hint">${y}년 ${m}월 조별 생성 미리보기 · 인원에게는 코드와 조(1~${L}조)를 함께 부여합니다.</p>
    <div class="prev">${prev}</div>
  </div>`;
}
function bindCodes(){
  document.querySelectorAll('tr[data-code]').forEach(tr=>tr.onclick=()=>{ UI.codeSel=tr.dataset.code; saveUI(); render(); });
  $('#newCode').onclick=()=>{ let i=1; while(codeMap['NEW-'+pad(i)]) i++; const c={id:'NEW-'+pad(i),name:'새 근무조',job:'SEC',ltype:'일반',seq:'AAAAADD',anchor:'2025-12-29',hol:true,times:{A:{s:'08:00',e:'17:00',b:1}}}; S.codes.push(c); reindex(); UI.codeSel=c.id; save(); render(); };
  const c = codeMap[UI.codeSel]; if(!c) return;
  $('#cSave').onclick=()=>{
    const id=$('#cId').value.trim(), seq=$('#cSeq').value.trim().toUpperCase();
    if(!id){ $('#cErr').textContent='코드를 입력하세요.'; return; }
    if(id!==c.id && codeMap[id]){ $('#cErr').textContent='이미 있는 코드입니다. 다른 코드를 입력하세요.'; return; }
    if(!/^[ABKD]{1,31}$/.test(seq)){ $('#cErr').textContent='순환 패턴은 A, B, K, D 문자로 1~31자까지 입력하세요.'; return; }
    const times={};
    document.querySelectorAll('[data-t]').forEach(inp=>{ const s=inp.dataset.t; times[s]=times[s]||Object.assign({}, (c.times&&c.times[s])||DEF_T[s]); times[s][inp.dataset.f]= inp.dataset.f==='b'? Number(inp.value)||0 : inp.value; });
    ['A','B','K'].forEach(s=>{ if(seq.includes(s) && !times[s]) times[s]=Object.assign({}, (c.times&&c.times[s])||DEF_T[s]); });
    if(id!==c.id){ S.emps.forEach(e=>e.hist.forEach(h=>{ if(h.code===c.id) h.code=id; })); }
    Object.assign(c,{id,name:$('#cName').value.trim()||id,job:$('#cJob').value,ltype:$('#cLt').value,seq,anchor:$('#cAn').value||c.anchor,hol:$('#cHol').checked,times});
    UI.codeSel=id; reindex(); save(); render(); toast('코드를 저장했습니다');
  };
  $('#cDup').onclick=()=>{ let i=1; while(codeMap[c.id+'-C'+i]) i++; const n=clone(c); n.id=c.id+'-C'+i; n.name=c.name+' (복제)'; S.codes.push(n); reindex(); UI.codeSel=n.id; save(); render(); };
  $('#cDel').onclick=()=>{
    const used = S.emps.filter(e=>e.hist.some(h=>h.code===c.id)).length;
    if(used){ $('#cErr').textContent=`이 코드를 쓰는 인원이 ${used}명 있습니다. 인원의 근무조를 먼저 바꾸세요.`; return; }
    $('#cConfirm').innerHTML=`<span class="confirm">삭제할까요? <button class="btn sm warn" id="cY">삭제</button><button class="btn sm" id="cN">취소</button></span>`;
    $('#cN').onclick=()=>$('#cConfirm').innerHTML='';
    $('#cY').onclick=()=>{ S.codes=S.codes.filter(x=>x.id!==c.id); reindex(); UI.codeSel=null; save(); render(); toast('코드를 삭제했습니다'); };
  };
}

/* ===== Page: 인원 관리 ===== */
function pagePeople(){
  const {y,m}=UI;
  const list = S.emps.filter(e=>(!UI.empSite||e.site===UI.empSite) && (!UI.empQ || e.name.includes(UI.empQ) || (e.post||'').includes(UI.empQ)));
  const sel = S.emps.find(e=>e.id===UI.empSel) || null;
  const rows = list.map(e=>{ const a=assignment(e,y,m); const c=a&&codeMap[a.code]; const act = employed(e, iso(y,m,dim(y,m))) || employed(e, iso(y,m,1));
    return `<tr data-emp="${e.id}" class="${e.id===UI.empSel?'sel':''}"><td><b>${esc(e.name)}</b></td><td>${esc((siteMap[e.site]||{}).name||'')}</td><td>${esc(e.post)}</td><td>${c?`<span class="code-id">${esc(c.id)}</span> · ${a.jo+1}조`:'<span class="neg">미지정</span>'}</td><td>${c?seqHtml(c.seq):''}</td><td>${act?'<span class="tag">재직</span>':'<span class="tag">퇴사/미입사</span>'}</td></tr>`; }).join('');
  return `<div class="two">
    <div class="panel"><div class="panel-h"><h2>인원 ${list.length}명</h2>
      <div class="sp"><select id="pSite" aria-label="사업장 필터" class="btn"><option value="">전체 사업장</option>${S.sites.map(s=>`<option value="${s.id}" ${s.id===UI.empSite?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <input id="pQ" class="btn" placeholder="성명·POST 검색" value="${esc(UI.empQ||'')}" style="width:140px"><button class="btn pri" id="pNew">인원 추가</button></div></div>
      <div class="tbl-wrap"><table class="list"><thead><tr><th>성명</th><th>사업장</th><th>POST</th><th>${m}월 근무조</th><th>패턴</th><th>상태</th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty">조건에 맞는 인원이 없습니다.</div></td></tr>'}</tbody></table></div></div>
    <div class="panel" id="empEd">${sel?empEditor(sel):'<div class="empty">왼쪽 목록에서 인원을 선택하면 근무조 코드, 조, 입·퇴사일을 수정할 수 있습니다.</div>'}</div>
  </div>`;
}
function joOptions(code, jo){ const L=code?code.seq.length:1; return Array.from({length:L},(_,j)=>`<option value="${j}" ${j===jo?'selected':''}>${j+1}조</option>`).join(''); }
function nextDays(code, jo, y, m, cnt){ if(!code) return ''; let s=''; const st=dnum(y,m,1); for(let i=0;i<cnt;i++){ s+=code.seq[mod(st+i-parseIso(code.anchor)+jo, code.seq.length)]; } return s; }
function empEditor(e){
  const {y,m}=UI; const hist=[...e.hist].sort((a,b)=>a.from<b.from?-1:1);
  const codeOpts = id => S.codes.map(c=>`<option value="${esc(c.id)}" ${c.id===id?'selected':''}>${esc(c.id)} · ${esc(c.name)}</option>`).join('');
  const a = assignment(e,y,m); const c0 = a && codeMap[a.code];
  return `<div class="panel-h"><h2>${esc(e.name)}</h2><div class="sp"><span class="tag">${esc(e.id)}</span></div></div>
  <div class="panel-b">
    <div class="grid2">
      <div class="field"><label for="eName">성명</label><input id="eName" value="${esc(e.name)}"></div>
      <div class="field"><label for="eSite">사업장</label><select id="eSite">${S.sites.map(s=>`<option value="${s.id}" ${s.id===e.site?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="ePart">파트</label><input id="ePart" value="${esc(e.part)}" placeholder="예: 공장 보안"></div>
      <div class="field"><label for="ePost">POST (직책·근무형태)</label><input id="ePost" value="${esc(e.post)}"></div>
      <div class="field"><label for="eHire">입사일</label><input id="eHire" type="date" value="${esc(e.hire)}"></div>
      <div class="field"><label for="eLeave">퇴사일</label><input id="eLeave" type="date" value="${esc(e.leave)}"></div>
    </div>
    <div class="field"><label for="eMemo">비고 (요약 줄에 표시)</label><input id="eMemo" value="${esc(e.memo)}"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px"><button class="btn pri" id="eSave">기본정보 저장</button><button class="btn warn" id="eDel">인원 삭제</button><span id="eConfirm"></span></div>

    <h3 style="font-size:14px;margin:0 0 6px">근무조 부여 이력</h3>
    <p class="hint">적용 시작월부터 해당 코드·조로 매월 자동 생성됩니다. 근무형태가 바뀌면 시작월을 정해 새 이력을 추가하세요. 이전 달 근태는 바뀌지 않습니다.</p>
    <ul class="hist">${hist.map((h,i)=>{ const c=codeMap[h.code]; return `<li><span class="num">${esc(h.from)}~</span><span class="code-id">${esc(h.code)}</span><span>${c?esc(c.name):'(삭제된 코드)'}</span><span>${h.jo+1}조</span>${hist.length>1?`<button class="btn sm warn" data-hdel="${i}" style="margin-left:auto">삭제</button>`:''}</li>`; }).join('')}</ul>
    <div class="grid2">
      <div class="field"><label for="hFrom">적용 시작월</label><input id="hFrom" type="month" value="${ym(y,m)}" min="2026-01"></div>
      <div class="field"><label for="hJo">조 (순번)</label><select id="hJo">${joOptions(c0, a?a.jo:0)}</select></div>
    </div>
    <div class="field"><label for="hCode">근무조 코드</label><select id="hCode">${codeOpts(a?a.code:'')}</select></div>
    <div class="calc" id="hPrev"></div>
    <button class="btn pri" id="hAdd">근무조 적용</button>
    <div class="err" id="eErr"></div>
  </div>`;
}
function bindPeople(){
  $('#pSite').onchange=ev=>{ UI.empSite=ev.target.value; saveUI(); render(); };
  const q=$('#pQ'); q.oninput=()=>{ UI.empQ=q.value; saveUI(); const p=q.selectionStart; render(); const q2=$('#pQ'); q2.focus(); q2.setSelectionRange(p,p); };
  document.querySelectorAll('tr[data-emp]').forEach(tr=>tr.onclick=()=>{ UI.empSel=tr.dataset.emp; saveUI(); render(); });
  $('#pNew').onclick=()=>{ let i=S.emps.length+1; while(S.emps.some(e=>e.id==='E'+String(i).padStart(3,'0'))) i++;
    const e={id:'E'+String(i).padStart(3,'0'),site:UI.empSite||UI.site||S.sites[0].id,part:'',post:'',name:'신규 인원',hist:[{from:ym(UI.y,UI.m),code:S.codes[0].id,jo:0}],hire:iso(UI.y,UI.m,1),leave:'',memo:'',ov:{}};
    S.emps.push(e); UI.empSel=e.id; save(); render(); toast('인원을 추가했습니다. 정보를 입력하세요'); };
  const e = S.emps.find(x=>x.id===UI.empSel); if(!e) return;
  const prev=()=>{ const c=codeMap[$('#hCode').value]; const [yy,mm]=($('#hFrom').value||ym(UI.y,UI.m)).split('-').map(Number);
    $('#hPrev').innerHTML = c ? `${yy}년 ${mm}월 1일부터 14일: ${seqHtml(nextDays(c, +$('#hJo').value, yy, mm, 14))}` : ''; };
  $('#hCode').onchange=()=>{ const c=codeMap[$('#hCode').value]; $('#hJo').innerHTML=joOptions(c,0); prev(); };
  $('#hJo').onchange=prev; $('#hFrom').onchange=prev; prev();
  $('#hAdd').onclick=()=>{ const from=$('#hFrom').value; if(!/^\d{4}-\d{2}$/.test(from)){ $('#eErr').textContent='적용 시작월을 선택하세요.'; return; }
    e.hist = e.hist.filter(h=>h.from!==from); e.hist.push({from, code:$('#hCode').value, jo:+$('#hJo').value}); save(); render(); toast(from+'부터 근무조를 적용했습니다'); };
  document.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{ const hist=[...e.hist].sort((a,b)=>a.from<b.from?-1:1); const h=hist[+b.dataset.hdel]; e.hist=e.hist.filter(x=>x!==h); save(); render(); });
  $('#eSave').onclick=()=>{ Object.assign(e,{name:$('#eName').value.trim()||e.name,site:$('#eSite').value,part:$('#ePart').value,post:$('#ePost').value,hire:$('#eHire').value,leave:$('#eLeave').value,memo:$('#eMemo').value}); save(); render(); toast('저장했습니다'); };
  $('#eDel').onclick=()=>{ $('#eConfirm').innerHTML=`<span class="confirm">${esc(e.name)} 인원과 변경 기록을 삭제할까요? 퇴사자는 퇴사일만 넣는 편이 기록이 남습니다. <button class="btn sm warn" id="eY">삭제</button><button class="btn sm" id="eN">취소</button></span>`;
    $('#eN').onclick=()=>$('#eConfirm').innerHTML=''; $('#eY').onclick=()=>{ S.emps=S.emps.filter(x=>x!==e); UI.empSel=null; save(); render(); toast('삭제했습니다'); }; };
}

/* ===== Page: 월 집계 ===== */
function pageReport(){
  const {y,m}=UI; const all=[]; const bySite = S.sites.map(s=>{ const rs = siteEmps(s.id).map(e=>({e,r:monthCalc(e,y,m)})).filter(x=>x.r.active); all.push(...rs);
    const t = rs.reduce((a,{r})=>{ a.p+=r.planH; a.a+=r.actH; a.pl+=r.plus; a.mi+=r.minus; a.b+=r.billed; a.lv+=r.leave; a.ab+=r.absent; a.ed+=r.edits; return a; },{p:0,a:0,pl:0,mi:0,b:0,lv:0,ab:0,ed:0});
    return {s, n:rs.length, t}; });
  const T = bySite.reduce((a,x)=>{ for(const k in x.t) a[k]=(a[k]||0)+x.t[k]; a.n=(a.n||0)+x.n; return a; },{});
  const top = all.filter(x=>x.r.plus>0).sort((a,b)=>b.r.plus-a.r.plus).slice(0,12);
  return `<div class="sheet-head"><div><h1>${y}년 ${m}월 근태 집계</h1><div class="sub">전 사업장 · 휴게시간 반영 실근로 기준</div></div><div class="acts"><button class="btn" id="copyRep">엑셀용 복사</button></div></div>
  <div class="kpis">
    <div class="kpi"><span>근무 인원</span><b>${T.n||0}</b></div><div class="kpi"><span>계획시간</span><b>${fmtH(T.p||0)}</b></div><div class="kpi"><span>실근로</span><b>${fmtH(T.a||0)}</b></div>
    <div class="kpi"><span>추가근무</span><b class="pos">+${fmtH(T.pl||0)}</b></div><div class="kpi"><span>공제</span><b class="neg">−${fmtH(T.mi||0)}</b></div><div class="kpi"><span>반영시간</span><b>${fmtH(T.b||0)}</b></div><div class="kpi"><span>연차 사용</span><b>${fmtH(T.lv||0)}일</b></div>
  </div>
  <div class="two">
    <div class="panel"><div class="panel-h"><h2>사업장별</h2></div><div class="tbl-wrap"><table class="list" id="repTbl"><thead><tr><th>사업장</th><th class="r">인원</th><th class="r">계획h</th><th class="r">실근로h</th><th class="r">추가h</th><th class="r">공제h</th><th class="r">반영h</th><th class="r">연차</th><th class="r">결근</th><th class="r">변경건</th></tr></thead><tbody>
      ${bySite.map(x=>`<tr data-go="${x.s.id}"><td>${esc(x.s.name)}</td><td class="r num">${x.n}</td><td class="r num">${fmtH(x.t.p)}</td><td class="r num">${fmtH(x.t.a)}</td><td class="r num pos">${x.t.pl?'+'+fmtH(x.t.pl):''}</td><td class="r num neg">${x.t.mi?'−'+fmtH(x.t.mi):''}</td><td class="r num"><b>${fmtH(x.t.b)}</b></td><td class="r num">${x.t.lv||''}</td><td class="r num">${x.t.ab||''}</td><td class="r num">${x.t.ed||''}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="panel"><div class="panel-h"><h2>추가근무 상위 인원</h2></div><div class="tbl-wrap"><table class="list"><thead><tr><th>성명</th><th>사업장</th><th>형태</th><th class="r">추가h</th><th class="r">반영h</th></tr></thead><tbody>
      ${top.map(({e,r})=>`<tr data-go="${e.site}"><td><b>${esc(e.name)}</b></td><td>${esc(siteMap[e.site].name)}</td><td><span class="tag ${r.code&&r.code.ltype==='감시단속'?'watch':''}">${esc(r.code?r.code.ltype:'')}</span></td><td class="r num pos">+${fmtH(r.plus)}</td><td class="r num"><b>${fmtH(r.billed)}</b></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">이 달에는 추가근무 입력이 없습니다.</div></td></tr>'}
    </tbody></table></div></div>
  </div>`;
}
function bindReport(){
  document.querySelectorAll('[data-go]').forEach(tr=>tr.onclick=()=>{ UI.site=tr.dataset.go; saveUI(); location.hash='grid'; });
  $('#copyRep').onclick=()=>{ const rows=[...document.querySelectorAll('#repTbl tr')].map(tr=>[...tr.children].map(td=>td.textContent.trim()).join('\t')).join('\n'); copyText(rows,'집계표를 복사했습니다'); };
}

/* ===== Page: 설정 ===== */

  return `<div class="two">

function migrate(o){
  if(!Array.isArray(o.orgs)){
    o.orgs=[{id:'O01',name:'에스텍베스트',type:'회사',parent:''},{id:'O02',name:'동부지사',type:'지사',parent:'O01'}];
    REGION_HINT.forEach(([n],i)=>o.orgs.push({id:'O'+pad(i+3),name:n,type:'권역',parent:'O02'}));
    o.sites.forEach(s=>{ if(s.org) return; const hit=REGION_HINT.findIndex(([,ks])=>ks.some(k=>s.name.includes(k))); s.org = hit>=0 ? 'O'+pad(hit+3) : 'O02'; });
  }
  if(!('manager' in o)) o.manager=null;
  if(!o.shareUrl) o.shareUrl=APP.shareUrl;
  o.app=APP.version; return o;
}

const monthCalcRaw = monthCalc;
monthCalc = function(e,y,m){ const k=e.id+'|'+y+'-'+m; if(!_mc.has(k)) _mc.set(k, monthCalcRaw(e,y,m)); return _mc.get(k); };

const orgChildren = id => S.orgs.filter(o=>o.parent===id);

function orgPath(id){ const p=[]; let o=orgMap[id], g=0; while(o && g++<20){ p.unshift(o); o=orgMap[o.parent]; } return p; }
function aggSites(sites){ const {y,m}=UI; const t={sites:sites.length,n:0,p:0,a:0,pl:0,mi:0,b:0,lv:0,ab:0,ed:0};
  sites.forEach(s=>siteEmps(s.id).forEach(e=>{ const r=monthCalc(e,y,m); if(!r.active) return; t.n++; t.p+=r.planH; t.a+=r.actH; t.pl+=r.plus; t.mi+=r.minus; t.b+=r.billed; t.lv+=r.leave; t.ab+=r.absent; t.ed+=r.edits; })); return t; }

function bindConfigExtra(){
  $('#cfMgr').onclick=openMgr;
  $('#cfUrlSave').onclick=()=>{ const v=$('#cfUrl').value.trim(); if(!/^https?:\/\//.test(v)){ toast('http:// 또는 https:// 로 시작하는 주소를 입력하세요'); return; } S.shareUrl=v; save(); renderHeader(); toast('배포 주소를 저장했습니다'); };
  document.querySelectorAll('[data-on]').forEach(i=>i.onchange=()=>{ orgMap[i.dataset.on].name=i.value.trim()||orgMap[i.dataset.on].name; save(); toast('조직명을 저장했습니다'); });
  document.querySelectorAll('[data-ot]').forEach(i=>i.onchange=()=>{ orgMap[i.dataset.ot].type=i.value; save(); render(); });
  document.querySelectorAll('[data-op]').forEach(i=>i.onchange=()=>{ orgMap[i.dataset.op].parent=i.value; save(); render(); });
  document.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{ const id=b.dataset.odel; if(orgChildren(id).length || S.sites.some(s=>s.org===id)){ $('#oErr').textContent='하위 조직이나 연결된 사업장이 있는 조직은 삭제할 수 없습니다. 먼저 옮기세요.'; return; } S.orgs=S.orgs.filter(o=>o.id!==id); reindex(); save(); render(); });
  $('#noAdd').onclick=()=>{ const n=$('#noName').value.trim(); if(!n){ $('#oErr').textContent='조직명을 입력하세요.'; return; } let i=S.orgs.length+1; while(orgMap['O'+pad(i)]) i++; S.orgs.push({id:'O'+pad(i),name:n,type:$('#noType').value,parent:$('#noPar').value}); reindex(); save(); render(); toast('조직을 추가했습니다'); };
  document.querySelectorAll('[data-sorg]').forEach(i=>i.onchange=()=>{ siteMap[i.dataset.sorg].org=i.value; save(); toast('사업장 소속을 바꿨습니다'); });
}

const hav = (a,b,c,d)=>{ const R=6371, t=x=>x*Math.PI/180; const x=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const kmTxt = d => d<1 ? `${Math.round(d*1000)}m` : `${d.toFixed(d<10?1:0)}km`;
const MAPX = {api:null, sel:null, me:null, type:'map', view:null, q:'', msg:''};
let kakaoP = null;
function loadKakao(){
  if(window.kakao && kakao.maps && kakao.maps.LatLng) return Promise.resolve(true);
  if(kakaoP) return kakaoP;
  kakaoP = new Promise(res=>{ let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    const sc=document.createElement('script'); sc.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+KAKAO_KEY+'&autoload=false';
    sc.onload=()=>{ try{ kakao.maps.load(()=>fin(true)); }catch(e){ fin(false); } };
    sc.onerror=()=>fin(false); setTimeout(()=>fin(false),7000); document.head.appendChild(sc); });
  return kakaoP;
}
function mapPoints(){
  const pts=[]; const used=new Set();
  S.sites.forEach(s=>{ if(s.lat){ pts.push({kind:'ams', key:'a'+s.id, name:s.name, lat:s.lat, lng:s.lng, addr:s.addr||'', site:s}); if(s.gid) used.add(s.gid); } });
  GROUP.best.forEach(b=>{ if(!used.has(b.id)) pts.push({kind:'best', key:'b'+b.id, name:b.name, lat:b.lat, lng:b.lng, addr:b.addr, info:b, br:b.br+'지사'}); });
  GROUP.sys.forEach((b,i)=>pts.push({kind:'sys', key:'y'+i, name:b.name, lat:b.lat, lng:b.lng, br:b.br}));
  GROUP.offices.filter(o=>o.t==='본부'||o.t==='본사').forEach((o,i)=>pts.push({kind:'office', key:'o'+i, name:o.n, lat:o.lat, lng:o.lng, addr:o.addr}));
  GROUP.branches.forEach((b,i)=>pts.push({kind:'branch', key:'r'+i, name:'베스트 '+b.name, lat:b.lat, lng:b.lng, addr:b.addr, brKey:b.key}));
  return pts;
}
const KIND_LABEL = {ams:'근태 사업장', best:'에스텍베스트', sys:'에스텍시스템', office:'본부', branch:'지사'};

/* --- Kakao engine --- */
function kakaoEngine(el, pts, onPick){
  const K=kakao.maps; const v=MAPX.view;
  const m=new K.Map(el,{center:new K.LatLng(v?v.lat:35.75, v?v.lng:128.9), level:v&&v.level?v.level:10});
  m.setMapTypeId(MAPX.type==='sky'?K.MapTypeId.HYBRID:K.MapTypeId.ROADMAP);
  const ovs=[]; let meOv=null;
  const order={sys:1,best:2,ams:4,office:5,branch:6};
  pts.forEach(p=>{ const d=document.createElement('div');
    if(p.kind==='branch'||p.kind==='office'){ d.className='mk mk-lab'+(p.kind==='office'?' off':''); d.textContent=p.name; }
    else d.className='mk mk-'+p.kind;
    d.title=p.name; d.onclick=e=>{ e.stopPropagation(); onPick(p); };
    const ov=new K.CustomOverlay({position:new K.LatLng(p.lat,p.lng), content:d, yAnchor:p.kind==='ams'?1.1:(p.kind==='branch'||p.kind==='office'?1.6:0.5), zIndex:order[p.kind]||1});
    ov.setMap(m); ovs.push({p,d}); });
  const save=()=>{ const c=m.getCenter(); MAPX.view={lat:c.getLat(), lng:c.getLng(), level:m.getLevel()}; };
  K.event.addListener(m,'idle',save);
  return {kind:'kakao',
    zoom:dz=>m.setLevel(m.getLevel()-dz),
    focus:(lat,lng,close)=>{ if(close && m.getLevel()>6) m.setLevel(6); m.panTo(new K.LatLng(lat,lng)); },
    type:t=>m.setMapTypeId(t==='sky'?K.MapTypeId.HYBRID:K.MapTypeId.ROADMAP),
    select:key=>ovs.forEach(o=>o.d.classList.toggle('mk-sel', o.p.key===key)),
    me:pos=>{ if(meOv) meOv.setMap(null); const d=document.createElement('div'); d.className='mk mk-me'; d.title='내 위치'; meOv=new K.CustomOverlay({position:new K.LatLng(pos.lat,pos.lng),content:d,zIndex:9}); meOv.setMap(m); },
    relayout:()=>m.relayout()};
}

/* --- built-in vector engine (no external tiles) --- */
function vectorEngine(el, pts, onPick){
  const cv=document.createElement('canvas'); el.appendChild(cv); const g=cv.getContext('2d');
  const merc = lat => Math.log(Math.tan(Math.PI/4+lat*Math.PI/360))*180/Math.PI;
  let W=0,H=0,dpr=1; const st = MAPX.view && MAPX.view.scale ? {...MAPX.view} : {lat:35.75, lng:128.9, scale:0};
  let selKey=null, mePos=MAPX.me;
  const fit=()=>{ if(!st.scale) st.scale = Math.min(W/4.6, H/(merc(38.7)-merc(33.0))); };
  const toXY=(lat,lng)=>[(lng-st.lng)*st.scale+W/2, (merc(st.lat)-merc(lat))*st.scale+H/2];
  const toLL=(x,y)=>{ const lng=(x-W/2)/st.scale+st.lng; const my=merc(st.lat)-(y-H/2)/st.scale; return [Math.atan(Math.sinh(my*Math.PI/180))*180/Math.PI, lng]; };
  const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';
  function draw(){
    const C={sea:tok('--map-sea'),land:tok('--map-land'),land2:tok('--map-land2'),coast:tok('--map-coast'),best:tok('--mk-best'),sys:tok('--mk-sys'),ams:tok('--mk-ams'),me:tok('--mk-me'),off:tok('--mk-office'),ink:tok('--ink'),panel:tok('--panel')};
    g.setTransform(dpr,0,0,dpr,0,0); g.fillStyle=C.sea; g.fillRect(0,0,W,H);
    for(const [nm,rings] of Object.entries(KOREA)){ g.fillStyle = nm==='South Korea'?C.land:C.land2; g.strokeStyle=C.coast; g.lineWidth=1;
      rings.forEach(r=>{ g.beginPath(); r.forEach((p,i)=>{ const [x,y]=toXY(p[1],p[0]); i?g.lineTo(x,y):g.moveTo(x,y); }); g.closePath(); g.fill(); g.stroke(); }); }
    const z=st.scale;
    pts.filter(p=>p.kind==='sys').forEach(p=>{ const [x,y]=toXY(p.lat,p.lng); g.save(); g.translate(x,y); g.rotate(Math.PI/4); g.fillStyle=C.sys; g.fillRect(-3.5,-3.5,7,7); g.restore(); });
    pts.filter(p=>p.kind==='best').forEach(p=>{ const [x,y]=toXY(p.lat,p.lng); g.beginPath(); g.arc(x,y,4.5,0,7); g.fillStyle=C.best; g.fill(); g.lineWidth=1.5; g.strokeStyle='#fff'; g.stroke(); });
    pts.filter(p=>p.kind==='ams').forEach(p=>{ const [x,y]=toXY(p.lat,p.lng); g.beginPath(); g.arc(x,y-9,6.5,Math.PI*0.85,Math.PI*2.15); g.lineTo(x,y); g.closePath(); g.fillStyle=C.ams; g.fill(); g.lineWidth=1.5; g.strokeStyle='#fff'; g.stroke();
      if(z>420){ g.font='600 11px '+getComputedStyle(document.body).fontFamily; g.fillStyle=C.ink; g.strokeStyle=C.panel; g.lineWidth=3; g.strokeText(p.name.slice(0,14),x+8,y-8); g.fillText(p.name.slice(0,14),x+8,y-8); } });
    const lab=(p,col)=>{ const [x,y]=toXY(p.lat,p.lng); g.font='700 12px '+getComputedStyle(document.body).fontFamily; const w=g.measureText(p.name).width+14;
      g.fillStyle='#fff'; g.strokeStyle=col; g.lineWidth=1.5; const rx=x-w/2, ry=y-30; g.beginPath(); g.roundRect ? g.roundRect(rx,ry,w,20,5) : g.rect(rx,ry,w,20); g.fill(); g.stroke(); g.fillStyle=col; g.fillText(p.name,rx+7,ry+14.5); };
    pts.filter(p=>p.kind==='office').forEach(p=>lab(p,'#c2410c'));
    pts.filter(p=>p.kind==='branch').forEach(p=>lab(p,'#16205e'));
    if(mePos){ const [x,y]=toXY(mePos.lat,mePos.lng); g.beginPath(); g.arc(x,y,13,0,7); g.fillStyle='rgba(47,124,246,.22)'; g.fill(); g.beginPath(); g.arc(x,y,6,0,7); g.fillStyle=C.me; g.fill(); g.lineWidth=2.5; g.strokeStyle='#fff'; g.stroke(); }
    if(selKey){ const p=pts.find(q=>q.key===selKey); if(p){ const [x,y]=toXY(p.lat,p.lng); g.beginPath(); g.arc(x,y-(p.kind==='ams'?8:0),12,0,7); g.lineWidth=3; g.strokeStyle='#f5b400'; g.stroke(); } }
    MAPX.view={lat:st.lat,lng:st.lng,scale:st.scale};
  }
  function size(){ const r=el.getBoundingClientRect(); W=r.width; H=r.height; dpr=window.devicePixelRatio||1; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); fit(); draw(); }
  const ro = window.ResizeObserver ? new ResizeObserver(size) : null; ro ? ro.observe(el) : window.addEventListener('resize',size);
  const ptrs=new Map(); let moved=false, pinch0=null;
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY}); moved=false; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y), s:st.scale}; } });
  cv.addEventListener('pointermove',e=>{ const p=ptrs.get(e.pointerId); if(!p) return;
    if(ptrs.size===2 && pinch0){ ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY}); const [a,b]=[...ptrs.values()]; st.scale=Math.max(60,Math.min(40000,pinch0.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch0.d)); moved=true; draw(); return; }
    const dx=e.offsetX-p.x, dy=e.offsetY-p.y; if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
    const [la,ln]=toLL(W/2-dx,H/2-dy); st.lat=la; st.lng=ln; ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY}); draw(); });
  const up=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null;
    if(!moved && e.type==='pointerup'){ let best=null, bd=14; pts.forEach(p=>{ const [x,y]=toXY(p.lat,p.lng); const yy = p.kind==='ams'? y-8 : (p.kind==='branch'||p.kind==='office') ? y-20 : y; const d=Math.hypot(x-e.offsetX,yy-e.offsetY); const pr = p.kind==='ams'?-4:0; if(d+pr<bd){ bd=d+pr; best=p; } }); if(best) onPick(best); } };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  const zoomAt=(f,x,y)=>{ const [la,ln]=toLL(x,y); st.scale=Math.max(60,Math.min(40000,st.scale*f)); const [la2,ln2]=toLL(x,y); st.lat+=la-la2; st.lng+=ln-ln2; draw(); };
  cv.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.deltaY<0?1.25:0.8, e.offsetX, e.offsetY); },{passive:false});
  cv.addEventListener('dblclick',e=>zoomAt(1.8,e.offsetX,e.offsetY));
  size();
  return {kind:'vector', zoom:dz=>zoomAt(dz>0?1.6:0.625,W/2,H/2), focus:(lat,lng,close)=>{ st.lat=lat; st.lng=lng; if(close && st.scale<900) st.scale=900; draw(); },
    type:()=>{}, select:k=>{ selKey=k; draw(); }, me:p=>{ mePos=p; draw(); }, relayout:size, redraw:draw};
}

    if(ok){ MAPX.api=kakaoEngine(el, MAPX.pts, p=>pickPoint(p,false)); stEl.textContent='카카오맵 연결됨'; setTimeout(()=>stEl.hidden=true,2500); }
    else { MAPX.api=vectorEngine(el, MAPX.pts, p=>pickPoint(p,false)); stEl.textContent='기본 지도로 표시 중 · 카카오맵은 웹 주소·앱에서 연결됩니다'; }
  }catch(e){ MAPX.api=vectorEngine(el, MAPX.pts, p=>pickPoint(p,false)); stEl.textContent='기본 지도로 표시 중'; }
  if(MAPX.me) MAPX.api.me(MAPX.me);
  if(MAPX.sel) MAPX.api.select(MAPX.sel.key);
}
function bindMapSection(){
  if(!$('#mapEl')) return;
  $('#spQ').oninput=ev=>{ MAPX.q=ev.target.value; MAPX.sel=null; if(MAPX.api) MAPX.api.select(null); renderSp(); };
  $('#mzIn').onclick=()=>MAPX.api&&MAPX.api.zoom(1); $('#mzOut').onclick=()=>MAPX.api&&MAPX.api.zoom(-1);
  document.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{
    if(b.dataset.mt==='sky' && MAPX.api && MAPX.api.kind!=='kakao'){ toast('스카이뷰는 카카오맵이 연결된 웹 주소·앱에서 볼 수 있습니다'); return; }
    MAPX.type=b.dataset.mt; document.querySelectorAll('[data-mt]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); MAPX.api&&MAPX.api.type(MAPX.type); });
  $('#mapMe').onclick=()=>{
    if(!navigator.geolocation){ toast('이 기기에서는 위치를 확인할 수 없습니다'); return; }
    toast('내 위치를 확인하는 중입니다');
    navigator.geolocation.getCurrentPosition(pos=>{ MAPX.me={lat:pos.coords.latitude,lng:pos.coords.longitude}; if(MAPX.api){ MAPX.api.me(MAPX.me); MAPX.api.focus(MAPX.me.lat,MAPX.me.lng,true); } renderSp(); toast('내 위치를 표시했습니다'); },
      err=>toast(err.code===1 ? '위치 권한이 허용되지 않았습니다. 브라우저·앱 설정에서 위치를 허용하세요' : '위치를 찾지 못했습니다. 잠시 후 다시 누르세요'), {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
  };
  initMapSection();
}

/* ===== router ===== */
const PAGES = {home:[pageHome,bindHome], org:[pageOrg,bindOrg], grid:[pageGrid,bindGrid], person:[pagePerson,bindPerson], codes:[pageCodes,bindCodes], people:[pagePeople,bindPeople], report:[pageReport,bindReport], config:[pageConfig,bindConfig]};
function render(){
  closeEditor(); _mc.clear();
  if(!S.manager || !S.manager.name){ $('#menu').hidden=true; $('#view').innerHTML=pageGate(); bindGate(); render._last='gate'; return; }
  const k = (location.hash||'').slice(1); const key = PAGES[k] ? k : 'home';
  document.querySelectorAll('.tabs a').forEach(a=>a.setAttribute('aria-current', a.getAttribute('href')==='#'+key ? 'page':'false'));
  const sc = document.querySelector('.scroller'); const keep = sc ? [sc.scrollLeft, sc.scrollTop] : null; const wy = window.scrollY;
  $('#view').innerHTML = PAGES[key][0](); PAGES[key][1]();
  const sc2 = document.querySelector('.scroller'); if(sc2 && keep && render._last===key){ sc2.scrollLeft=keep[0]; sc2.scrollTop=keep[1]; window.scrollTo(0,wy); }
  render._last = key; initMonthBar.sync();
}
$('#ver').textContent = 'v'+APP.version; $('#fver').textContent = 'v'+APP.version; $('#sig').textContent = APP.author;
document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.themeSet));
$('#mgrCard').onclick=openMgr; $('#qrCard').onclick=openQR; $('#refCard').onclick=openRef;
applyTheme(UI.theme||'system'); renderHeader();
initMonthBar(); window.addEventListener('hashchange', render); render();
window.addEventListener('load', ()=>{ renderHeader(); });
</script>
